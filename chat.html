<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulgaria Gaming Zone - Live Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 0;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    .retro-chat-container {
      width: 100%;
      height: 150px; /* Фиксирана височина около 4 см */
      max-height: 150px;
      background-color: #111111;
      border: 2px solid #ffee00;
      box-shadow: 0 0 12px rgba(255, 238, 0, 0.25);
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      overflow: hidden;
    }

    .chat-header {
      background: #ffee00;
      color: #000;
      padding: 2px 8px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .chat-body {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 4px 6px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: #080808;
      border-right: 1px solid #282828;
      min-height: 0;
    }

    .online-users-panel {
      width: 130px;
      background: #0d0d0d;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      min-height: 0;
    }

    .online-title {
      font-size: 9px;
      color: #ffee00;
      font-weight: bold;
      border-bottom: 1px solid #282828;
      padding-bottom: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .users-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 0;
    }

    /* КОМПАКТНИ СКРОЛБАРОВЕ */
    .chat-messages::-webkit-scrollbar,
    .users-list::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track,
    .users-list::-webkit-scrollbar-track {
      background: #000000;
    }

    .chat-messages::-webkit-scrollbar-thumb,
    .users-list::-webkit-scrollbar-thumb {
      background: #ffee00;
      border-radius: 2px;
    }

    .user-item {
      font-size: 10px;
      color: #00ff66;
      display: flex;
      align-items: center;
      gap: 3px;
      word-break: break-all;
    }

    .user-item::before {
      content: "●";
      font-size: 7px;
    }

    .chat-msg {
      font-size: 11px;
      line-height: 1.2;
      word-break: break-word;
    }

    .chat-msg .time {
      color: #666;
      font-size: 9px;
      margin-right: 3px;
    }

    .chat-msg .username {
      color: #ffee00;
      font-weight: bold;
      margin-right: 3px;
    }

    .chat-msg .text {
      color: #ffffff;
    }

    .chat-input-area {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #161616;
      border-top: 1px solid #282828;
      flex-shrink: 0;
    }

    .chat-input-area input {
      background: #000;
      border: 1px solid #ffee00;
      color: #fff;
      padding: 2px 6px;
      font-family: inherit;
      font-size: 10px;
      outline: none;
      border-radius: 2px;
    }

    .chat-input-area input:focus {
      box-shadow: 0 0 4px #ffee00;
    }

    #chat-name {
      width: 80px;
      flex-shrink: 0;
    }

    #chat-text {
      flex: 1;
      min-width: 0;
    }

    .chat-btn {
      background: #ffee00;
      color: #000;
      border: none;
      padding: 2px 8px;
      font-weight: bold;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .chat-btn:hover {
      background: #ffffff;
    }
  </style>
</head>
<body>

<div class="retro-chat-container">
  <div class="chat-header">BULGARIA GAMING ZONE - LIVE CHAT</div>
  
  <div class="chat-body">
    <div class="chat-messages" id="chat-messages"></div>
    
    <div class="online-users-panel">
      <div class="online-title">Онлайн (<span id="user-count">0</span>)</div>
      <ul class="users-list" id="users-list"></ul>
    </div>
  </div>

  <form class="chat-input-area" id="chat-form">
    <input type="text" id="chat-name" placeholder="Ник" maxlength="15" required>
    <input type="text" id="chat-text" placeholder="Съобщение..." autocomplete="off" maxlength="200" required>
    <button type="submit" class="chat-btn">Прати</button>
  </form>
</div>

<!-- Firebase Classic SDKs (Работи директно от локален файл file://) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAwAjdbV8NLL33ovLR8j3shl9tk7HaFfWk",
    authDomain: "bulgaria-gaming-zone-chat.firebaseapp.com",
    databaseURL: "https://bulgaria-gaming-zone-chat-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bulgaria-gaming-zone-chat",
    storageBucket: "bulgaria-gaming-zone-chat.firebasestorage.app",
    messagingSenderId: "183397526491",
    appId: "1:183397526491:web:c7c0c2a23693494e3fd5fe",
    measurementId: "G-L0JMK4H302"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref('chat_messages');
  const presenceRef = db.ref('online_users');

  const form = document.getElementById('chat-form');
  const nameInput = document.getElementById('chat-name');
  const textInput = document.getElementById('chat-text');
  const messagesDiv = document.getElementById('chat-messages');
  const usersListDiv = document.getElementById('users-list');
  const userCountSpan = document.getElementById('user-count');

  // Уникален ID за сесията при F5
  let chatSessionId = localStorage.getItem('bulgaria_gaming_zone_global_chat_id');
  if (!chatSessionId) {
    chatSessionId = 'user_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
    localStorage.setItem('bulgaria_gaming_zone_global_chat_id', chatSessionId);
  }
  const myPresenceRef = db.ref('online_users/' + chatSessionId);

  let lastMessageTime = 0;
  let lastMessageText = "";
  const COOLDOWN_MS = 2500;

  const BANNED_WORDS = [
    "кур", "копеле", "курва", "пичка", "педераст", "патка", "кучка", "гей", "педал", "хуй", "хуя"
  ];

  function censorText(text) {
    let cleanText = text;
    BANNED_WORDS.forEach(word => {
      const regex = new RegExp(word, "gi");
      cleanText = cleanText.replace(regex, "***");
    });
    return cleanText;
  }

  if (localStorage.getItem('chat_nickname')) {
    nameInput.value = localStorage.getItem('chat_nickname');
  } else {
    nameInput.value = "Guest_" + Math.floor(Math.random() * 8999 + 1000);
  }

  // Изтриване на съобщения по-стари от 24 часа
  function cleanOldMessages() {
    const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
    messagesRef.orderByChild('timestamp').endAt(twentyFourHoursAgo).once('value', (snapshot) => {
      if (snapshot.exists()) {
        snapshot.forEach((child) => {
          child.ref.remove();
        });
      }
    });
  }
  cleanOldMessages();

  // Проверка за уникалност на ника
  async function getUniqueUsername(baseName) {
    try {
      const snapshot = await presenceRef.once('value');
      if (!snapshot.exists()) return baseName;

      const users = snapshot.val();
      const now = Date.now();
      let takenNames = [];

      for (let key in users) {
        if (key !== chatSessionId) {
          const u = users[key];
          if (u && u.lastSeen && (now - u.lastSeen < 8000)) {
            if (u.username) takenNames.push(u.username.toLowerCase());
          }
        }
      }

      let finalName = baseName;
      let counter = 1;
      while (takenNames.includes(finalName.toLowerCase())) {
        finalName = baseName + counter;
        counter++;
      }
      return finalName;
    } catch (e) {
      return baseName;
    }
  }

  // Обновяване на онлайн статуса
  async function updateOnlineStatus() {
    let rawName = nameInput.value.trim() || "Guest";
    const uniqueName = await getUniqueUsername(rawName);

    if (uniqueName !== rawName) {
      nameInput.value = uniqueName;
      localStorage.setItem('chat_nickname', uniqueName);
    }

    db.ref('.info/connected').on('value', (snap) => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove();
        myPresenceRef.set({
          username: uniqueName,
          lastSeen: Date.now()
        });
      }
    });
  }

  // Изпращане на Пулс (Heartbeat) на всеки 3 секунди
  setInterval(() => {
    const rawName = nameInput.value.trim() || "Guest";
    myPresenceRef.set({
      username: rawName,
      lastSeen: Date.now()
    });
  }, 3000);

  updateOnlineStatus();

  nameInput.addEventListener('change', async () => {
    let rawName = nameInput.value.trim();
    if (rawName) {
      const uniqueName = await getUniqueUsername(rawName);
      nameInput.value = uniqueName;
      localStorage.setItem('chat_nickname', uniqueName);
      myPresenceRef.set({
        username: uniqueName,
        lastSeen: Date.now()
      });
    }
  });

  // Показване на онлайн потребители и автоматично махане на F5 клонинги
  presenceRef.on('value', (snapshot) => {
    renderOnlineUsers(snapshot.val());
  });

  setInterval(() => {
    presenceRef.once('value', (snap) => {
      if (snap.exists()) renderOnlineUsers(snap.val());
    });
  }, 2000);

  function renderOnlineUsers(users) {
    usersListDiv.innerHTML = '';
    if (!users) {
      userCountSpan.textContent = '0';
      return;
    }

    const now = Date.now();
    const uniqueActiveUsers = new Set();

    for (let key in users) {
      const u = users[key];
      // Махане на неактивен таб/клонинг, ако няма сигнал над 8 сек
      if (u && u.lastSeen && (now - u.lastSeen > 8000)) {
        db.ref('online_users/' + key).remove();
        continue;
      }

      if (u && u.username) {
        uniqueActiveUsers.add(u.username);
      }
    }

    userCountSpan.textContent = uniqueActiveUsers.size;
    uniqueActiveUsers.forEach(username => {
      const li = document.createElement('li');
      li.className = 'user-item';
      li.textContent = username;
      usersListDiv.appendChild(li);
    });
  }

  // Изпращане на съобщение
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let name = nameInput.value.trim();
    const text = textInput.value.trim();
    const now = Date.now();

    if (!name || !text) return;

    name = await getUniqueUsername(name);
    nameInput.value = name;
    localStorage.setItem('chat_nickname', name);

    if (now - lastMessageTime < COOLDOWN_MS) {
      const waitSec = Math.ceil((COOLDOWN_MS - (now - lastMessageTime)) / 1000);
      alert(`Моля, изчакай ${waitSec} сек. преди следващото съобщение!`);
      return;
    }

    if (text === lastMessageText) {
      alert("Не можеш да изпращаш същото съобщение повторно!");
      return;
    }

    if (text.length > 200) {
      alert("Съобщението е прекалено дълго (максимум 200 символа)!");
      return;
    }

    const cleanText = censorText(text);

    lastMessageTime = now;
    lastMessageText = text;

    messagesRef.push({
      username: name,
      text: cleanText,
      timestamp: now
    });
    textInput.value = '';
  });

  // Четене на съобщения
  messagesRef.limitToLast(50).on('child_added', (snapshot) => {
    const data = snapshot.val();
    const key = snapshot.key;
    if (!data) return;

    const time = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const msgEl = document.createElement('div');
    msgEl.className = 'chat-msg';
    msgEl.id = 'msg-' + key;
    msgEl.innerHTML = `
      <span class="time">[${time}]</span>
      <span class="username">&lt;${escapeHtml(data.username)}&gt;:</span>
      <span class="text">${escapeHtml(data.text)}</span>
    `;

    messagesDiv.appendChild(msgEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  messagesRef.on('child_removed', (snapshot) => {
    const deletedEl = document.getElementById('msg-' + snapshot.key);
    if (deletedEl) {
      deletedEl.remove();
    }
  });

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
