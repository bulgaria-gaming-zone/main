<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Zone Bulgaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .background-container {
            background-image: url('bgz_web_background.jpg');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        .top-banner {
            position: absolute;
            top: 50px;
            right: 15%;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 15px 30px;
            text-align: left;
            border-radius: 4px;
        }

        .top-banner a {
            color: #E2EC10;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .top-banner a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="top-banner">
            <a href="https://bulgaria-gaming-zone.github.io/main/" target="_blank">
                КЛИКНЕТЕ ТУК, ЗА ДА ПОСЕТИТЕ НАШИЯ САЙТ
            </a>
        </div>
    </div>

</body>
</html>
