<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BULGARIA | GaminG Zone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        .header-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .header-link {
            display: block;
            width: 100%;
            max-width: 1920px;
            cursor: pointer;
        }

        .header-banner {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        .header-link:hover .header-banner {
            transform: scale(1.01);
            filter: brightness(1.05);
        }

        /* Неподвижно меню точно под банера */
        .nav-menu-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .social-links {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link-item {
            display: inline-block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
            cursor: pointer;
        }

        .social-link-item:hover {
            transform: scale(1.12);
            filter: brightness(1.15);
        }

        .icon-fb {
            width: 82px;
            height: 81px;
            display: block;
        }

        .icon-discord {
            width: 90px;
            height: 68px;
            display: block;
        }

        .icon-download {
            width: 81px;
            height: 80px;
            display: block;
            opacity: 0.9;
        }

        /* Основно съдържание */
        .main-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
            margin: 20px 20px;
        }

        /* Стил за секцията по дизайн */
        .downloads-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .downloads-title {
            color: #ffff00;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        footer {
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            color: #ffff00;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <a href="https://bulgaria-gaming-zone.github.io/main/" class="header-link">
            <img src="header_banner.png" alt="GAMING BULGARIA ZONE Header" class="header-banner">
        </a>
    </header>

    <!-- Неподвижно меню с иконите точно под банера -->
    <nav class="nav-menu-container">
        <div class="social-links">
            <!-- Facebook Link -->
            <a href="https://www.facebook.com/groups/389530691674289/" target="_blank" rel="noopener noreferrer" class="social-link-item">
                <img src="facebook_icon.png" alt="Facebook Group" class="icon-fb">
            </a>

            <!-- Discord Link -->
            <a href="https://discord.gg/yyG5CpQ" target="_blank" rel="noopener noreferrer" class="social-link-item">
                <img src="discord_icon.png" alt="Discord Server" class="icon-discord">
            </a>

            <!-- Download Button (препраща към Download.html) -->
            <a href="https://bulgaria-gaming-zone.github.io/main/Download.html" class="social-link-item">
                <img src="download_icon.png" alt="Download Menu" class="icon-download">
            </a>
        </div>
    </nav>

    <!-- Основно съдържание -->
    <main class="main-content">
        <section id="downloads-section" class="downloads-section">
            <h2 class="downloads-title">Добре Дошли!</h2>
        </section>
    </main>

    <footer>
        &copy; 2026 BULGARIA|GaminG Zone|&trade;
    </footer>

</body>
</html>
