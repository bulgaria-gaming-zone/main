<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BULGARIA | GaminG Zone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        .header-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .header-link {
            display: block;
            width: 100%;
            max-width: 1920px;
            cursor: pointer;
        }

        .header-banner {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        .header-link:hover .header-banner {
            transform: scale(1.01);
            filter: brightness(1.05);
        }

        /* Неподвижно меню точно под банера */
        .nav-menu-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .social-links {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link-item {
            display: inline-block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
            cursor: pointer;
        }

        .social-link-item:hover {
            transform: scale(1.12);
            filter: brightness(1.15);
        }

        /* Стандартен размер за Facebook, Discord и Download */
        .nav-icon {
            width: 75px;
            height: 75px;
            display: block;
            object-fit: contain;
        }

        /* Зададен размер 95px на 87px за Home иконата */
        .icon-home {
            width: 95px;
            height: 87px;
            display: block;
            object-fit: contain;
        }

        .icon-download {
            opacity: 0.9;
        }

        /* Основно съдържание */
        .main-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
            margin: 20px 20px;
        }

        /* Стил за секцията */
        .downloads-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .downloads-title {
            color: #ffff00;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .download-box {
            width: 100%;
            background-color: #000000;
            border: 1px solid #ffff00;
            border-radius: 4px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.1);
            margin-bottom: 20px;
        }

        .download-box-text {
            color: #ffff00;
            font-size: 20px;
            font-weight: 500;
        }

        .download-icons-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .game-icon-link {
            display: inline-block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
            cursor: pointer;
        }

        .game-icon-link:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .icon-game {
            height: 55px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        footer {
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            color: #ffff00;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <a href="https://bulgaria-gaming-zone.github.io/main/" class="header-link">
            <img src="header_banner.png" alt="GAMING BULGARIA ZONE Header" class="header-banner">
        </a>
    </header>

    <!-- Неподвижно меню с иконите точно под банера -->
    <nav class="nav-menu-container">
        <div class="social-links">
            <!-- Home Link -->
            <a href="https://bulgaria-gaming-zone.github.io/main/" class="social-link-item" title="Начало">
                <img src="home_icon.png" alt="Home" class="icon-home">
            </a>

            <!-- Facebook Link -->
            <a href="https://www.facebook.com/groups/389530691674289/" target="_blank" rel="noopener noreferrer" class="social-link-item" title="Facebook Group">
                <img src="facebook_icon.png" alt="Facebook" class="nav-icon">
            </a>

            <!-- Discord Link -->
            <a href="https://discord.gg/yyG5CpQ" target="_blank" rel="noopener noreferrer" class="social-link-item" title="Discord Server">
                <img src="discord_icon.png" alt="Discord" class="nav-icon">
            </a>

            <!-- Download Button -->
            <a href="https://bulgaria-gaming-zone.github.io/main/Download.html" class="social-link-item" title="Download Menu">
                <img src="download_icon.png" alt="Download" class="nav-icon icon-download">
            </a>
        </div>
    </nav>

    <!-- Основно съдържание -->
    <main class="main-content">
        <section id="downloads-section" class="downloads-section">
            <h2 class="downloads-title">Добре дошли и приятна игра в нашите сървъри!</h2>
            
            <!-- Terraria Server Box -->
            <div class="download-box">
                <span class="download-box-text">Terraria Server: bulgaria-gaming-zone.asuscomm.com</span>
                <div class="download-icons-group">
                    <!-- Terraria Icon Link (Copies IP on click) -->
                    <a onclick="copyServerIP('bulgaria-gaming-zone.asuscomm.com', this)" class="game-icon-link" title="Копирай линка за сървъра">
                        <img src="terraria_icon.png" alt="Terraria" class="icon-game">
                    </a>
                </div>
            </div>

            <!-- Half-Life Server Box -->
            <div class="download-box">
                <span class="download-box-text">Half-Life Server: bulgaria-gaming-zone.asuscomm.com</span>
                <div class="download-icons-group">
                    <!-- Half-Life Icon Link (Copies IP on click) -->
                    <a onclick="copyServerIP('bulgaria-gaming-zone.asuscomm.com', this)" class="game-icon-link" title="Копирай линка за сървъра">
                        <img src="halflife_icon.png" alt="Half-Life" class="icon-game">
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 BULGARIA|GaminG Zone|&trade;
    </footer>

    <script>
        function copyServerIP(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                let originalTitle = element.getAttribute('title');
                element.setAttribute('title', 'Линкът е копиран!');
                setTimeout(() => {
                    element.setAttribute('title', originalTitle);
                }, 2000);
            }).catch(err => {
                console.error('Грешка при копиране: ', err);
            });
        }
    </script>
</body>
</html>
