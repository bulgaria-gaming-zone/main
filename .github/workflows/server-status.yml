name: Game Server UDP Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-servers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UDP server test
        run: |
          cat > udp-test.js <<'EOF'
          const dgram = require('dgram');

          const servers = [
            { name: 'Half-Life Server', host: '84.85.150.109', port: 27015 },
            { name: 'CS1.6 fy_Server', host: '84.85.150.109', port: 27016 },
            { name: 'CS1.6 de_Server', host: '84.85.150.109', port: 27017 }
          ];

          const query = Buffer.from(
            'ffffffff54536f7572636520456e67696e6520517565727900',
            'hex'
          );

          function testServer(server) {
            return new Promise((resolve) => {
              const socket = dgram.createSocket('udp4');

              let finished = false;

              const finish = (result) => {
                if (finished) return;
                finished = true;

                try {
                  socket.close();
                } catch {}

                resolve(result);
              };

              socket.on('message', (message, rinfo) => {
                console.log('');
                console.log(`===== ${server.name} =====`);
                console.log(`RESPONSE RECEIVED`);
                console.log(`From: ${rinfo.address}:${rinfo.port}`);
                console.log(`Bytes: ${message.length}`);
                console.log(`Hex: ${message.toString('hex')}`);

                finish({
                  name: server.name,
                  online: true,
                  players: 0,
                  maxplayers: 0,
                  map: '',
                  error: ''
                });
              });

              socket.on('error', (error) => {
                console.log('');
                console.log(`===== ${server.name} =====`);
                console.log(`UDP SOCKET ERROR: ${error.message}`);

                finish({
                  name: server.name,
                  online: false,
                  players: 0,
                  maxplayers: 0,
                  map: '',
                  error: error.message
                });
              });

              socket.bind(() => {
                const address = socket.address();

                console.log('');
                console.log(`===== ${server.name} =====`);
                console.log(`Sending UDP query...`);
                console.log(`Destination: ${server.host}:${server.port}`);
                console.log(`Local UDP port: ${address.port}`);

                socket.send(
                  query,
                  0,
                  query.length,
                  server.port,
                  server.host,
                  (error) => {
                    if (error) {
                      console.log(`SEND ERROR: ${error.message}`);

                      finish({
                        name: server.name,
                        online: false,
                        players: 0,
                        maxplayers: 0,
                        map: '',
                        error: error.message
                      });
                    } else {
                      console.log('UDP query sent successfully.');
                      console.log('Waiting 10 seconds for response...');
                    }
                  }
                );
              });

              setTimeout(() => {
                console.log('');
                console.log(`===== ${server.name} =====`);
                console.log('NO UDP RESPONSE - TIMEOUT');

                finish({
                  name: server.name,
                  online: false,
                  players: 0,
                  maxplayers: 0,
                  map: '',
                  error: 'No UDP response after 10 seconds'
                });
              }, 10000);
            });
          }

          async function main() {
            const result = {
              updated: new Date().toISOString(),
              servers: {}
            };

            for (const server of servers) {
              const id =
                server.port === 27015 ? 'hl' :
                server.port === 27016 ? 'cs_fy' :
                'cs_de';

              result.servers[id] = await testServer(server);
            }

            require('fs').writeFileSync(
              'status.json',
              JSON.stringify(result, null, 2) + '\n'
            );

            console.log('');
            console.log('===== FINAL RESULT =====');
            console.log(JSON.stringify(result, null, 2));
          }

          main();
          EOF

          node udp-test.js

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No changes in server status."
          else
            git commit -m "Update game server status"
            git push
          fi
