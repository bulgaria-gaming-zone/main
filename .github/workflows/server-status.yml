name: Update Server Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get server status and push to Firebase
        run: |
          # 1. Теглене на данните от Gamemonitoring
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842836 -o /tmp/cs_fy.json || echo '{"response":{}}' > /tmp/cs_fy.json
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842850 -o /tmp/cs_de.json || echo '{"response":{}}' > /tmp/cs_de.json

          # 2. Обработка и директен PUT към rank.json във Firebase Realtime Database
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          def load_json(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                      return data.get("response", data) if isinstance(data, dict) else {}
              except Exception:
                  return {}

          def parse_server_data(raw_data):
              if not raw_data or not isinstance(raw_data, dict):
                  return {
                      "name": "Offline / Error",
                      "online": False,
                      "players": 0,
                      "maxplayers": 0,
                      "map": "-",
                      "connect": ""
                  }
              
              raw_status = raw_data.get("status", False)
              is_online = bool(raw_status) if raw_status is not None else False

              return {
                  "name": raw_data.get("name", "CS 1.6 Server"),
                  "online": is_online,
                  "players": int(raw_data.get("numplayers", raw_data.get("players", 0))),
                  "maxplayers": int(raw_data.get("maxplayers", 0)),
                  "map": raw_data.get("map", "-"),
                  "connect": raw_data.get("connect", f"{raw_data.get('ip', '')}:{raw_data.get('port', '')}")
              }

          fy = parse_server_data(load_json("/tmp/cs_fy.json"))
          de = parse_server_data(load_json("/tmp/cs_de.json"))

          status = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "servers": {
                  "cs_fy": fy,
                  "cs_de": de
              }
          }

          # Адресът към твоята Firebase база, записващ в rank.json
          FIREBASE_URL = "https://server-status-20342-default-rtdb.europe-west1.firebasedatabase.app/rank.json"

          data = json.dumps(status).encode("utf-8")
          req = urllib.request.Request(FIREBASE_URL, data=data, headers={"Content-Type": "application/json"}, method="PUT")

          try:
              with urllib.request.urlopen(req) as resp:
                  print("Firebase update successful! HTTP Code:", resp.getcode())
          except Exception as e:
              print("Error updating Firebase:", e)
          PY
