name: Update Server Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get server status and push to Firebase
        run: |
          # 1. Теглене на данните от Gamemonitoring
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842836 -o /tmp/cs_fy.json || echo '{"response":{}}' > /tmp/cs_fy.json
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842850 -o /tmp/cs_de.json || echo '{"response":{}}' > /tmp/cs_de.json

          # 2. Обработка и директен PUT към Firebase Realtime Database
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          def load_json(path):
              try:
                  with open(path) as f:
                      return json.load(f).get("response", {})
              except Exception:
                  return {}

          fy = load_json("/tmp/cs_fy.json")
          de = load_json("/tmp/cs_de.json")

          status = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "servers": {
                  "cs_fy": {
                      "name": fy.get("name", "Offline / Error"),
                      "online": fy.get("status", False),
                      "players": fy.get("numplayers", 0),
                      "maxplayers": fy.get("maxplayers", 0),
                      "map": fy.get("map", ""),
                      "connect": fy.get("connect", "")
                  },
                  "cs_de": {
                      "name": de.get("name", "Offline / Error"),
                      "online": de.get("status", False),
                      "players": de.get("numplayers", 0),
                      "maxplayers": de.get("maxplayers", 0),
                      "map": de.get("map", ""),
                      "connect": de.get("connect", "")
                  }
              }
          }

          FIREBASE_URL = "https://status-rank-default-rtdb.europe-west1.firebasedatabase.app/status.json"

          data = json.dumps(status).encode("utf-8")
          req = urllib.request.Request(FIREBASE_URL, data=data, headers={"Content-Type": "application/json"}, method="PUT")

          try:
              with urllib.request.urlopen(req) as resp:
                  print("Firebase update successful! HTTP Code:", resp.getcode())
          except Exception as e:
              print("Error updating Firebase:", e)
          PY
