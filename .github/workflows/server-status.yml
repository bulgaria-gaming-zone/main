name: Update Server Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get server status
        run: |
          mkdir -p data

          curl -fsSL https://api.gamemonitoring.net/servers/16842836 -o /tmp/cs_fy.json
          curl -fsSL https://api.gamemonitoring.net/servers/16842850 -o /tmp/cs_de.json

          python3 - <<'PY'
          import json

          with open("/tmp/cs_fy.json") as f:
              fy = json.load(f)["response"]["servers"][0]

          with open("/tmp/cs_de.json") as f:
              de = json.load(f)["response"]["servers"][0]

          status = {
              "updated": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "servers": {
                  "cs_fy": {
                      "name": fy.get("name", ""),
                      "online": fy.get("status", False),
                      "players": fy.get("numplayers", 0),
                      "maxplayers": fy.get("maxplayers", 0),
                      "map": fy.get("map", "")
                  },
                  "cs_de": {
                      "name": de.get("name", ""),
                      "online": de.get("status", False),
                      "players": de.get("numplayers", 0),
                      "maxplayers": de.get("maxplayers", 0),
                      "map": de.get("map", "")
                  }
              }
          }

          with open("data/status.json", "w") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/status.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update server status"
            git push
          fi
