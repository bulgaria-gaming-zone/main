name: Game Server Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-servers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GameDig
        run: npm install gamedig

      - name: Check game servers
        run: |
          cat > check-servers.js <<'EOF'
          const { GameDig } = require('gamedig');
          const fs = require('fs');

          const servers = {
            cs_fy: {
              name: 'CS1.6 fy_Server',
              type: 'counterstrike16',
              host: '84.85.150.109',
              port: 27016
            },
            cs_de: {
              name: 'CS1.6 de_Server',
              type: 'counterstrike16',
              host: '84.85.150.109',
              port: 27017
            },
            hl: {
              name: 'Half-Life Server',
              type: 'counterstrike16',
              host: '84.85.150.109',
              port: 27015
            }
          };

          async function checkServer(server) {
            try {
              const state = await GameDig.query({
                type: server.type,
                host: server.host,
                port: server.port,
                socketTimeout: 10000,
                attemptTimeout: 10000,
                maxRetries: 2,
                givenPortOnly: true,
                debug: true
              });

              console.log(`${server.name}: ONLINE`);

              return {
                name: server.name,
                online: true,
                players: Array.isArray(state.players) ? state.players.length : 0,
                maxplayers: state.maxplayers || 0,
                map: state.map || '',
                error: ''
              };

            } catch (error) {
              console.log(`${server.name}: OFFLINE`);
              console.log('ERROR:', error.message);

              return {
                name: server.name,
                online: false,
                players: 0,
                maxplayers: 0,
                map: '',
                error: error.message || String(error)
              };
            }
          }

          async function main() {
            const result = {
              updated: new Date().toISOString(),
              servers: {}
            };

            for (const [id, server] of Object.entries(servers)) {
              result.servers[id] = await checkServer(server);
            }

            fs.writeFileSync(
              'status.json',
              JSON.stringify(result, null, 2) + '\n'
            );

            console.log('status.json created.');
            console.log(JSON.stringify(result, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node check-servers.js

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No changes in server status."
          else
            git commit -m "Update game server status"
            git push
          fi
