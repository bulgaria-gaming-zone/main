name: Update Server Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # Защита: спира процеса автоматично, ако забие за повече от 3 мин.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get server status
        run: |
          mkdir -p data

          # --connect-timeout 5 и --max-time 10 гарантират, че curl няма да забие
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842836 -o /tmp/cs_fy.json || echo '{"response":{}}' > /tmp/cs_fy.json
          curl -fsSL --connect-timeout 5 --max-time 10 https://api.gamemonitoring.net/servers/16842850 -o /tmp/cs_de.json || echo '{"response":{}}' > /tmp/cs_de.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          def load_json(path):
              try:
                  with open(path) as f:
                      return json.load(f).get("response", {})
              except Exception:
                  return {}

          fy = load_json("/tmp/cs_fy.json")
          de = load_json("/tmp/cs_de.json")

          status = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "servers": {
                  "cs_fy": {
                      "name": fy.get("name", "Offline / Error"),
                      "online": fy.get("status", False),
                      "players": fy.get("numplayers", 0),
                      "maxplayers": fy.get("maxplayers", 0),
                      "map": fy.get("map", ""),
                      "connect": fy.get("connect", "")
                  },
                  "cs_de": {
                      "name": de.get("name", "Offline / Error"),
                      "online": de.get("status", False),
                      "players": de.get("numplayers", 0),
                      "maxplayers": de.get("maxplayers", 0),
                      "map": de.get("map", ""),
                      "connect": de.get("connect", "")
                  }
              }
          }

          with open("data/status.json", "w") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/status.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update server status"
            git push
          fi
