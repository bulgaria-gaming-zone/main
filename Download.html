    <title>BULGARIA | GaminG Zone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        .header-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .header-link {
            display: block;
            width: 100%;
            max-width: 1920px;
            cursor: pointer;
            overflow: hidden;
        }

        .header-banner {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        .header-link:hover .header-banner {
            transform: scale(1.01);
            filter: brightness(1.05);
        }

        @media (max-width: 768px) {
            .header-banner {
                transform: scale(1.82);
                transform-origin: center center;
                margin: 45px 0;
            }
        }

        .nav-menu-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .social-links {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link-item {
            display: inline-block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
            cursor: pointer;
        }

        .social-link-item:hover {
            transform: scale(1.12);
            filter: brightness(1.15);
        }

        .nav-icon {
            width: 54px;
            height: 54px;
            display: block;
            object-fit: contain;
        }

        .icon-home {
            width: 68.4px;
            height: 62.6px;
            display: block;
            object-fit: contain;
        }

        .icon-download {
            opacity: 0.9;
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
            margin: 20px 20px;
        }

        .downloads-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .downloads-title {
            color: #ffff00;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .download-box {
            width: 100%;
            background-color: #000000;
            border: 1px solid #ffff00;
            border-radius: 4px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.1);
            margin-bottom: 20px;
        }

        .download-box-text {
            color: #ffff00;
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Увеличена икона в текста */
        .inline-text-icon {
            height: 36px;
            width: auto;
            vertical-align: middle;
            display: inline-block;
            margin: 0 4px;
        }

        .download-icons-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .game-icon-link {
            display: inline-block;
            transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        .game-icon-link:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .icon-h3, .icon-vcmi, .icon-ra2, .icon-cncnet, .icon-terraria, .icon-rune {

            width: auto;

            color: #ffff00;
            font-weight: 700;

            letter-spacing: 0.5px;
            text-transform: uppercase;
            background-color: #000000;
